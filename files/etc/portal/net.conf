# Portal VPN: pin network parameters instead of auto-detecting them.
# Every value here overrides /etc/portal/portal-env.sh detection, so keep the
# lines commented unless your setup really needs them (the router LAN is not
# the default lan zone, WAN is unusual, or DNS must come from a fixed server).
#
#LAN_IF=br-lan
#LAN_NET=192.168.200.0/24
#LAN6_NETS=fd70:757c:7db8::/64
#WAN_IF=eth0
#WAN_NET=192.168.10.0/24
#WAN_GW=192.168.10.1
#WAN_DNS=192.168.10.1
