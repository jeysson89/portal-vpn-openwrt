name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.owrt }} (${{ matrix.fmt }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # opkg-based release -> .ipk
          - owrt: "24.10.4"
            fmt: ipk
          # apk-based release -> .apk
          - owrt: "25.12.5"
            fmt: apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync unzip zlib1g-dev file wget curl zstd

      - name: Download OpenWrt SDK ${{ matrix.owrt }}
        run: |
          set -euo pipefail
          base="https://downloads.openwrt.org/releases/${{ matrix.owrt }}/targets/mediatek/filogic/"
          file="$(curl -fsSL "$base" | grep -o 'openwrt-sdk-[^"]*Linux-x86_64\.tar\.zst' | head -n1)"
          if [ -z "$file" ]; then
            echo "::error::SDK archive not found at $base"
            exit 1
          fi
          echo "SDK: $file"
          # keep the SDK OUTSIDE the checkout: rsync of ./ below must never see it
          mkdir -p "$RUNNER_TEMP/sdk"
          curl -fsSL -o "$RUNNER_TEMP/sdk.tar.zst" "$base$file"
          tar --zstd -xf "$RUNNER_TEMP/sdk.tar.zst" -C "$RUNNER_TEMP"
          echo "SDK_DIR=$RUNNER_TEMP/${file%.tar.zst}" >> "$GITHUB_ENV"

      - name: Update feeds (luci-base, curl, ca-bundle come from feeds)
        run: |
          set -euo pipefail
          cd "$SDK_DIR"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add package to SDK
        run: |
          set -euo pipefail
          mkdir -p "$SDK_DIR/package/portal-vpn"
          rsync -a --exclude '.git' --exclude '.github' --exclude 'openwrt-sdk-*' ./ "$SDK_DIR/package/portal-vpn/"
          # make sure shell scripts keep LF inside the package
          find "$SDK_DIR/package/portal-vpn" -name '*.sh' -exec sed -i 's/\r$//' {} +

      - name: Build package
        run: |
          set -euo pipefail
          cd "$SDK_DIR"
          make defconfig
          make "package/portal-vpn/compile" V=s -j"$(nproc)"

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p out
          find "$SDK_DIR/bin/packages" -type f -name "*luci-app-portal*.${{ matrix.fmt }}" -exec cp -v {} out/ \;
          test -n "$(ls -A out)"
          ls -l out
          # per-format checksum file: two jobs must not upload the same asset name
          ( cd out && sha256sum * > "SHA256SUMS.${{ matrix.fmt }}" )

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-portal-${{ matrix.owrt }}-${{ matrix.fmt }}
          path: out/*
          if-no-files-found: error

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Combine checksums
        run: cat artifacts/*/SHA256SUMS.* > SHA256SUMS && cat SHA256SUMS

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
            SHA256SUMS
          generate_release_notes: true
          body: |
            OpenWrt packages for **mediatek/filogic (aarch64_cortex-a53)**:

            | OpenWrt | format | install |
            |---|---|---|
            | 24.10.x | `.ipk` | `opkg install luci-app-portal_*.ipk` |
            | 25.12.x | `.apk` | `apk add --allow-untrusted luci-app-portal-*.apk` |

            The package depends on `sing-box-tiny`, `curl`, `ca-bundle` and
            `kmod-tun`; install them from the official OpenWrt feeds if your
            build does not pull them automatically.
